services:
  pi-courier:
    build:
      context: .
      # 构建期代理(可选,仅当 VPS 需要代理访问外网时)
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    image: pi-courier:latest
    container_name: pi-courier
    restart: unless-stopped
    volumes:
      # pi agent 的家:pi CLI 的凭据/模型/会话(~/.pi 全平台不动,不随桥的三根
      # 分离迁移)。宿主侧保留整卷 ./data(而非 ./data/agent):0.2.x 老用户的
      # 旧平铺文件(pi-courier.json、pi-courier-matrix-* 等)就在这里,首启由
      # 桥自带迁移器自动搬进下面三个新卷,搬完 ./data 只剩 agent/,零手动搬动
      # (升级路径见 README「从 0.2.x 升级」)。
      - ./data:/root/.pi
      # 桥配置根:pi-courier.json(setup 向导写这里)
      - ./data/config:/root/.config/pi-courier
      # 桥数据根:Matrix 存储/加密库/附件(必须持久化,删了要重新配对验证)
      - ./data/lib:/root/.local/share/pi-courier
      # 桥状态根:心跳/审计/台账/队列快照/锁/日志(可重建,但删了审计与台账就没了)
      - ./data/state:/root/.local/state/pi-courier
      # 可选:把宿主机项目目录映射到容器内 workdir
      # (这样 pi 可以在容器里直接操作宿主机上的项目文件)
      # - ./projects:/root/Projects
    environment:
      - TZ=Asia/Shanghai
      # ---- 一键配置(推荐):设置这些变量后,无需 exec setup/编辑文件 ----
      # Matrix(必须:PI_MATRIX_HOMESERVER + PI_MATRIX_ACCESS_TOKEN 同时设置)
      - PI_MATRIX_HOMESERVER=${PI_MATRIX_HOMESERVER:-}
      - PI_MATRIX_ACCESS_TOKEN=${PI_MATRIX_ACCESS_TOKEN:-}
      # 信任用户(逗号分隔 MXID,预信任可跳过验证码;不设则走验证码配对)
      - PI_MATRIX_TRUSTED_USERS=${PI_MATRIX_TRUSTED_USERS:-}
      # 加密开关(true/false,默认 true)
      - PI_MATRIX_ENCRYPTION=${PI_MATRIX_ENCRYPTION:-}
      # 工作目录(容器内路径,默认 /root/Projects)
      - PI_WORKDIR=${PI_WORKDIR:-}
      # LLM API key(auth.json 模板已引用此变量)
      - PI_LLM_API_KEY=${PI_LLM_API_KEY:-}
      # 默认 provider/模型(可选,entrypoint 写入 settings.json)
      - PI_DEFAULT_PROVIDER=${PI_DEFAULT_PROVIDER:-}
      - PI_DEFAULT_MODEL=${PI_DEFAULT_MODEL:-}
      # 日志级别(debug/info/warn/error,可选)
      - PI_LOG_LEVEL=${PI_LOG_LEVEL:-}
      # GitHub CLI token(可选,gh auth 用)
      - GH_TOKEN=${GH_TOKEN:-}
      # 运行时代理(可选,仅当 Matrix / LLM provider 需要代理访问时)
      # - https_proxy=http://<host>:<port>
      # - http_proxy=http://<host>:<port>
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
