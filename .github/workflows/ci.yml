name: CI

on:
  push:
    branches:
      - master
      - develop
      - 'feat/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # npm ci 会触发根包 postinstall(scripts/ensure-crypto-native.mjs),
      # 从 GitHub Releases 下载 ~21MB 平台原生库;windows runner 上恰好
      # 真实验证 win32 下载路径,不要跳过或禁用该 postinstall。
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
